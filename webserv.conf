server{ 
    listen 127.0.0.1:4242;

    client_max_body_size 10m;

	location /{
		root ./data;
		allow_methods POST GET DELETE;
		cgi_path py /usr/bin/python3;
		autoindex on;
	}

    location /test{
        redirect https://google.fr;
        autoindex on;
    }
}

server{
	listen	0.0.0.0:4343;


	client_max_body_size 50m;
    error_page 404 ./data/error/404.html;

	location /{
		root ./data;
		allow_methods POST GET DELETE;
		autoindex on;
		upload_store ./data/upload;
		cgi_path py /usr/bin/python3;
	}

	location /ABCD {
		root ./data;
		allow_methods POST GET DELETE;
		autoindex on;
		index index.html;
		upload_store /etc/;
		cgi_path py /usr/bin/python3;
	}

	location /test {
		redirect https://google.fr;
	}
}
