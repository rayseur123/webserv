
<style>
  @keyframes flicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.4} 95%{opacity:1} 97%{opacity:0.7} 98%{opacity:1} }
  @keyframes scan { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }
  @keyframes pulse { 0%,100%{opacity:0.15} 50%{opacity:0.35} }
  @keyframes glitch1 { 0%,100%{clip-path:inset(0 0 95% 0)} 20%{clip-path:inset(30% 0 50% 0)} 40%{clip-path:inset(70% 0 10% 0)} 60%{clip-path:inset(5% 0 80% 0)} 80%{clip-path:inset(55% 0 25% 0)} }
  @keyframes glitch2 { 0%,100%{clip-path:inset(0 0 95% 0); transform:translateX(0)} 25%{clip-path:inset(20% 0 60% 0); transform:translateX(-4px)} 50%{clip-path:inset(65% 0 15% 0); transform:translateX(4px)} 75%{clip-path:inset(40% 0 40% 0); transform:translateX(-2px)} }
  @keyframes fadeup { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>

<div style="min-height:520px; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; padding:2rem; font-family:var(--font-mono);">

  <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.015) 2px,rgba(255,255,255,0.015) 4px);pointer-events:none;z-index:1;"></div>

  <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,80,80,0.6),transparent);animation:scan 3s linear infinite;z-index:2;opacity:0.5;pointer-events:none;"></div>

  <div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(8,1fr);gap:0;pointer-events:none;z-index:0;">
    <div style="grid-column:2/4;grid-row:1/3;border:0.5px solid rgba(255,80,80,0.08);animation:pulse 4s ease-in-out infinite;"></div>
    <div style="grid-column:9/12;grid-row:2/4;border:0.5px solid rgba(255,80,80,0.06);animation:pulse 5s ease-in-out infinite 1s;"></div>
    <div style="grid-column:1/3;grid-row:6/9;border:0.5px solid rgba(255,80,80,0.07);animation:pulse 6s ease-in-out infinite 2s;"></div>
    <div style="grid-column:10/13;grid-row:6/9;border:0.5px solid rgba(255,80,80,0.09);animation:pulse 4.5s ease-in-out infinite 0.5s;"></div>
  </div>

  <div style="position:relative;z-index:10;text-align:center;max-width:480px;">

    <div style="position:relative;display:inline-block;margin-bottom:0.5rem;animation:flicker 5s ease-in-out infinite;">
      <div style="font-size:96px;font-weight:700;letter-spacing:-4px;color:#ff3b3b;line-height:1;position:relative;user-select:none;">
        ✕
      </div>
      <div style="position:absolute;inset:0;font-size:96px;font-weight:700;letter-spacing:-4px;color:#00ffff;opacity:0.5;line-height:1;animation:glitch1 2.5s steps(1) infinite;transform:translateX(3px);">✕</div>
      <div style="position:absolute;inset:0;font-size:96px;font-weight:700;letter-spacing:-4px;color:#ff00ff;opacity:0.4;line-height:1;animation:glitch2 3.1s steps(1) infinite;transform:translateX(-3px);">✕</div>
    </div>

    <div style="color:rgba(255,59,59,0.25);font-size:11px;letter-spacing:6px;text-transform:uppercase;margin-bottom:2rem;animation:fadeup 0.8s ease 0.1s both;">système compromis</div>

    <div style="color:#ff3b3b;font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:0.75rem;animation:fadeup 0.8s ease 0.2s both;font-weight:500;">quelque chose s'est mal passé</div>

    <div style="width:200px;height:0.5px;background:linear-gradient(90deg,transparent,rgba(255,59,59,0.6),transparent);margin:0 auto 1.5rem;animation:fadeup 0.8s ease 0.3s both;"></div>

    <div style="color:rgba(255,255,255,0.25);font-size:12px;line-height:1.9;animation:fadeup 0.8s ease 0.4s both;letter-spacing:0.5px;">
      <span style="color:rgba(255,59,59,0.5);">›</span> état du système <span style="color:rgba(255,80,80,0.7);">inconnu</span><br>
      <span style="color:rgba(255,59,59,0.5);">›</span> données non récupérables<br>
      <span style="color:rgba(255,59,59,0.5);">›</span> connexion <span style="color:rgba(255,80,80,0.7);">interrompue</span>
    </div>

    <div style="margin-top:2.5rem;animation:fadeup 0.8s ease 0.6s both;">
      <button onclick="window.location.reload()" style="background:transparent;border:0.5px solid rgba(255,59,59,0.4);color:rgba(255,255,255,0.5);font-family:var(--font-mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:10px 28px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.borderColor='rgba(255,59,59,0.9)';this.style.color='rgba(255,255,255,0.9)';this.style.background='rgba(255,59,59,0.08)'" onmouseout="this.style.borderColor='rgba(255,59,59,0.4)';this.style.color='rgba(255,255,255,0.5)';this.style.background='transparent'">réessayer</button>
    </div>

    <div style="position:absolute;bottom:-3rem;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.04);font-size:10px;letter-spacing:2px;white-space:nowrap;">0x00 · 0x00 · 0x00</div>
  </div>
</div>
