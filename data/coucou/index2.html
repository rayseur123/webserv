<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>webserv // POST tester</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #13161d;
    --surface2: #1a1e28;
    --border: rgba(255,255,255,0.08);
    --accent: #7f77dd;
    --accent2: #5dcaa5;
    --accent3: #f0997b;
    --text: #e8e6f0;
    --muted: #888799;
    --danger: #e24b4a;
    --success: #639922;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 2rem 2.5rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .logo {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .logo span { color: var(--accent); }
  .logo em { color: var(--accent2); font-style: normal; }

  .badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 100px;
    background: rgba(127,119,221,0.15);
    color: var(--accent);
    border: 1px solid rgba(127,119,221,0.3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    flex: 1;
    min-height: 0;
  }

  .panel {
    padding: 2rem 2.5rem;
  }
  .panel + .panel {
    border-left: 1px solid var(--border);
  }

  .panel-title {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::before {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  .field {
    margin-bottom: 1.25rem;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  input, select, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: rgba(127,119,221,0.5);
    box-shadow: 0 0 0 3px rgba(127,119,221,0.08);
  }
  select option { background: #1a1e28; }

  textarea {
    resize: vertical;
    min-height: 120px;
    line-height: 1.5;
  }

  .url-row {
    display: flex;
    gap: 8px;
  }
  .method-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
    background: rgba(127,119,221,0.12);
    border: 1px solid rgba(127,119,221,0.3);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .content-type-row {
    display: flex;
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .ct-btn {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface2);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .ct-btn:hover { border-color: rgba(127,119,221,0.4); color: var(--text); }
  .ct-btn.active {
    background: rgba(127,119,221,0.15);
    border-color: rgba(127,119,221,0.5);
    color: var(--accent);
  }

  .send-btn {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 1.5rem;
  }
  .send-btn:hover { background: #9088e5; transform: translateY(-1px); }
  .send-btn:active { transform: translateY(0); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .send-btn .arrow {
    font-size: 16px;
    transition: transform 0.15s;
  }
  .send-btn:hover .arrow { transform: translateX(3px); }

  .response-area {
    min-height: 200px;
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
    height: 28px;
  }

  .status-pill {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 100px;
    display: none;
  }
  .status-pill.ok { background: rgba(99,153,34,0.2); color: #97c459; border: 1px solid rgba(99,153,34,0.3); display: inline-block; }
  .status-pill.err { background: rgba(226,75,74,0.15); color: #f09595; border: 1px solid rgba(226,75,74,0.3); display: inline-block; }
  .status-pill.pending { background: rgba(127,119,221,0.15); color: var(--accent); border: 1px solid rgba(127,119,221,0.3); display: inline-block; }

  .timing {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  .response-block {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .response-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .rtab {
    padding: 8px 16px;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.1s;
  }
  .rtab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .response-content {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    color: #c9c7e0;
    padding: 16px;
    max-height: 320px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    color: var(--muted);
    gap: 8px;
  }
  .empty-icon {
    font-size: 32px;
    opacity: 0.3;
  }
  .empty-text {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .loader {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .history-section {
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
    margin-bottom: 4px;
  }
  .history-item:hover { background: var(--surface2); }

  .history-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .history-dot.ok { background: #97c459; }
  .history-dot.err { background: #f09595; }

  .history-url {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-time {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; }
    .panel + .panel { border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span>web</span><em>serv</em></div>
  <div class="badge">42 project</div>
  <div class="badge" style="background: rgba(93,202,165,0.1); color: var(--accent2); border-color: rgba(93,202,165,0.3);">POST tester</div>
</header>

<main>
  <div class="panel">
    <div class="panel-title">Request</div>

    <div class="field">
      <label>Endpoint</label>
      <div class="url-row">
        <div class="method-badge">POST</div>
        <input type="text" id="url" value="http://localhost:8080/" placeholder="http://localhost:8080/upload" />
      </div>
    </div>

    <div class="field">
      <label>Content-Type</label>
      <div class="content-type-row">
        <div class="ct-btn active" data-ct="application/x-www-form-urlencoded">form</div>
        <div class="ct-btn" data-ct="application/json">json</div>
        <div class="ct-btn" data-ct="text/plain">text</div>
      </div>
    </div>

    <div class="field" id="field-body">
      <label>Body</label>
      <textarea id="body" placeholder="name=42&school=Paris&project=webserv"></textarea>
    </div>

    <div class="field">
      <label>Header supplémentaire <span style="color:var(--muted);font-size:10px">(optionnel)</span></label>
      <input type="text" id="extra-header-key" placeholder="X-Custom-Header" style="margin-bottom:6px" />
      <input type="text" id="extra-header-val" placeholder="valeur" />
    </div>

    <button class="send-btn" id="send-btn" onclick="sendRequest()">
      <div class="loader" id="loader"></div>
      <span id="btn-text">Envoyer la requête</span>
      <span class="arrow" id="btn-arrow">→</span>
    </button>
  </div>

  <div class="panel">
    <div class="panel-title">Response</div>

    <div class="status-line">
      <div class="status-pill" id="status-pill"></div>
      <div class="timing" id="timing"></div>
    </div>

    <div id="response-wrapper">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">◎</div>
        <div class="empty-text">En attente d'une requête</div>
      </div>
    </div>

    <div class="history-section" id="history-section" style="display:none">
      <div class="panel-title">Historique</div>
      <div id="history-list"></div>
    </div>
  </div>
</main>

<script>
  let currentCt = 'application/x-www-form-urlencoded';
  let history = [];

  document.querySelectorAll('.ct-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ct-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCt = btn.dataset.ct;
      const placeholder = currentCt === 'application/json'
        ? '{\n  "name": "42",\n  "school": "Paris",\n  "project": "webserv"\n}'
        : currentCt === 'text/plain'
        ? 'Contenu libre...'
        : 'name=42&school=Paris&project=webserv';
      document.getElementById('body').placeholder = placeholder;
    });
  });

  async function sendRequest() {
    const url = document.getElementById('url').value.trim();
    const body = document.getElementById('body').value;
    const extraKey = document.getElementById('extra-header-key').value.trim();
    const extraVal = document.getElementById('extra-header-val').value.trim();

    if (!url) { flashInput('url'); return; }

    const btn = document.getElementById('send-btn');
    const loader = document.getElementById('loader');
    const btnText = document.getElementById('btn-text');
    const btnArrow = document.getElementById('btn-arrow');
    btn.disabled = true;
    loader.style.display = 'block';
    btnText.textContent = 'Envoi...';
    btnArrow.style.display = 'none';

    const headers = { 'Content-Type': currentCt };
    if (extraKey && extraVal) headers[extraKey] = extraVal;

    const start = performance.now();
    let statusCode = null;
    let statusText = '';
    let responseBody = '';
    let responseHeaders = {};
    let isError = false;

    try {
      const res = await fetch(url, { method: 'POST', headers, body });
      const elapsed = Math.round(performance.now() - start);
      statusCode = res.status;
      statusText = res.statusText;
      responseBody = await res.text();
      res.headers.forEach((v, k) => { responseHeaders[k] = v; });
      isError = statusCode >= 400;
      showResponse(statusCode, statusText, responseBody, responseHeaders, elapsed, url, isError);
    } catch (e) {
      const elapsed = Math.round(performance.now() - start);
      isError = true;
      responseBody = e.message || 'Erreur réseau (serveur injoignable ?)';
      showResponse(null, 'Network Error', responseBody, {}, elapsed, url, true);
    }

    btn.disabled = false;
    loader.style.display = 'none';
    btnText.textContent = 'Envoyer la requête';
    btnArrow.style.display = 'inline';
  }

  function showResponse(code, text, body, hdrs, ms, url, isError) {
    const pill = document.getElementById('status-pill');
    const timing = document.getElementById('timing');
    const wrapper = document.getElementById('response-wrapper');

    pill.className = 'status-pill ' + (code === null ? 'err' : isError ? 'err' : 'ok');
    pill.textContent = code ? `${code} ${text}` : 'Error';

    timing.textContent = `${ms}ms`;

    const headersStr = Object.entries(hdrs).map(([k,v]) => `${k}: ${v}`).join('\n') || '(aucun)';

    wrapper.innerHTML = `
      <div class="response-block">
        <div class="response-tabs">
          <div class="rtab active" onclick="switchTab(this,'body')">Body</div>
          <div class="rtab" onclick="switchTab(this,'headers')">Headers</div>
          <div class="rtab" onclick="switchTab(this,'raw')">Raw</div>
        </div>
        <div class="response-content" id="tab-body">${escHtml(body || '(réponse vide)')}</div>
        <div class="response-content" id="tab-headers" style="display:none">${escHtml(headersStr)}</div>
        <div class="response-content" id="tab-raw" style="display:none">POST ${url}\nHTTP/${code || '?'} ${text}\n\n${escHtml(body || '')}</div>
      </div>
    `;

    addHistory(code, url, ms, isError);
  }

  function switchTab(el, tab) {
    document.querySelectorAll('.rtab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    ['body','headers','raw'].forEach(t => {
      const el2 = document.getElementById('tab-' + t);
      if (el2) el2.style.display = t === tab ? 'block' : 'none';
    });
  }

  function addHistory(code, url, ms, isError) {
    history.unshift({ code, url, ms, isError, ts: new Date().toLocaleTimeString('fr', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) });
    if (history.length > 8) history.pop();

    const section = document.getElementById('history-section');
    const list = document.getElementById('history-list');
    section.style.display = 'block';
    list.innerHTML = history.map((h, i) => `
      <div class="history-item" onclick="replayHistory(${i})">
        <div class="history-dot ${h.isError ? 'err' : 'ok'}"></div>
        <div class="history-url">${escHtml(h.url)}</div>
        <div class="history-time">${h.code || '✕'} · ${h.ms}ms · ${h.ts}</div>
      </div>
    `).join('');
  }

  function replayHistory(i) {
    const h = history[i];
    document.getElementById('url').value = h.url;
    window.scrollTo(0, 0);
  }

  function flashInput(id) {
    const el = document.getElementById(id);
    el.style.borderColor = 'rgba(226,75,74,0.6)';
    el.style.boxShadow = '0 0 0 3px rgba(226,75,74,0.08)';
    setTimeout(() => { el.style.borderColor = ''; el.style.boxShadow = ''; }, 1200);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') sendRequest();
  });
</script>
</body>
</html>
