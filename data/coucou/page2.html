<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
</head>
<body>
    <h1>📬 Formulaire de Contact</h1>
    <p>Un petit formulaire "bateau" pour tester les inputs.</p>
    
    <form action="/submit-test" method="GET">
        <label for="nom">Nom :</label><br>
        <input type="text" id="nom" name="nom" placeholder="Ton nom"><br><br>
        
        <label for="message">Message :</label><br>
        <textarea id="message" name="message" placeholder="Ton message ici..."></textarea><br><br>
        
        <button type="submit">Envoyer (Test)</button>
    </form>
    
    <hr>
    
    <p><a href="../index.html">⬅️ Retour à l'accueil</a></p>
</body>
</html>
